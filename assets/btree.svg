<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">pkg/tree · BTree</title><desc id="desc">Inserting 12 splits a full child, lifting median 10 into the root, then 12 lands in a leaf; Range(12, 30) yields keys in order.</desc><style>
svg{--bg:#ffffff;--card:#f6f8fa;--stroke:#d0d7de;--fg:#1f2328;--muted:#59636e;--blue:#0969da;--green:#1a7f37;--orange:#bc4c00;--red:#cf222e;--purple:#8250df}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--card:#161b22;--stroke:#3d444d;--fg:#e6edf3;--muted:#9198a1;--blue:#4493f8;--green:#3fb950;--orange:#f0883e;--red:#f85149;--purple:#ab7df8}}
.bg{fill:var(--bg);stroke:var(--stroke)}
.box{fill:var(--card);stroke:var(--stroke);stroke-width:1.5}
.slot{fill:none;stroke:var(--stroke);stroke-width:1.5;stroke-dasharray:5 4}
.grp{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:6 4}
.div{stroke:var(--stroke);stroke-width:1.5}
.h{fill:var(--fg);font:600 16px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.s{fill:var(--muted);font:13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.t{fill:var(--fg);font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.c{fill:var(--fg);font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.m{fill:var(--muted);font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.blue{fill:var(--blue)}.green{fill:var(--green)}.orange{fill:var(--orange)}.red{fill:var(--red)}.purple{fill:var(--purple)}
.e{stroke:var(--muted);stroke-width:1.6;fill:none}
.eb{stroke:var(--blue);stroke-width:1.6;fill:none}
.ep{stroke:var(--purple);stroke-width:1.6;fill:none}
.ring-o{fill:none;stroke:var(--orange);stroke-width:3}
.ring-g{fill:var(--green);fill-opacity:.18;stroke:var(--green);stroke-width:2.5}
.ring-r{fill:none;stroke:var(--red);stroke-width:3}
.hatch{fill:url(#hatch);stroke:var(--stroke)}
.hl{fill:var(--orange);fill-opacity:.15;stroke:var(--orange);stroke-width:2}
.mk-m{fill:var(--muted)}.mk-b{fill:var(--blue)}.mk-p{fill:var(--purple)}
</style><defs>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-m" d="M0 0L10 5L0 10z"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-b" d="M0 0L10 5L0 10z"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-p" d="M0 0L10 5L0 10z"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--muted);stroke-width:1.5;opacity:.6"/></pattern>
</defs><rect class="bg" x="0.5" y="0.5" width="639" height="359" rx="12"/><text x="24" y="34" class="h" text-anchor="start">pkg/tree · BTree</text><text x="24" y="54" class="s" text-anchor="start">Self-balancing B-tree with min degree t = 2</text><g opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.92;0.945;0.975;1" values="1;1;0;0;1"/><g opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.26;0.27;0.95;0.96;1" values="1;1;0;0;1;1"/><rect x="297" y="97" width="46" height="40" rx="8" class="box"/></g><g opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.26;0.27;0.95;0.96;1" values="1;1;0;0;1;1"/><rect x="117" y="197" width="126" height="40" rx="8" class="box"/></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.28;0.29;0.96;0.97;1" values="0;0;1;1;0;0"/><rect x="277" y="97" width="86" height="40" rx="8" class="box"/></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.28;0.29;0.96;0.97;1" values="0;0;1;1;0;0"/><rect x="97" y="197" width="46" height="40" rx="8" class="box"/></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.28;0.29;0.5;0.51;1" values="0;0;1;1;0;0"/><rect x="297" y="197" width="46" height="40" rx="8" class="box"/></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.49;0.5;0.96;0.97;1" values="0;0;1;1;0;0"/><rect x="257" y="197" width="86" height="40" rx="8" class="box"/></g><rect x="417" y="197" width="86" height="40" rx="8" class="box"/><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.128;0.14;0.26;0.272;1" values="0;0;1;1;0;0"/><rect x="114" y="191" width="132" height="52" rx="10" class="ring-r"/></g><g opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.26;0.27;0.95;0.96;1" values="1;1;0;0;1;1"/><line x1="300" y1="137" x2="180" y2="196" class="e"/><line x1="340" y1="137" x2="460" y2="196" class="e"/></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.28;0.29;0.96;0.97;1" values="0;0;1;1;0;0"/><line x1="280" y1="137" x2="120" y2="196" class="e"/><line x1="320" y1="137" x2="300" y2="196" class="e"/><line x1="360" y1="137" x2="460" y2="196" class="e"/></g><g transform="translate(120 200)"><animateTransform attributeName="transform" type="translate" dur="16s" repeatCount="indefinite" keyTimes="0;0.26;0.3;0.96;0.965;1" values="120 200;120 200;100 200;100 200;120 200;120 200"/><rect x="0" y="0" width="40" height="34" rx="4" class="box"/><text x="20" y="22" class="t" text-anchor="middle">5</text></g><g transform="translate(160 200)"><animateTransform attributeName="transform" type="translate" dur="16s" repeatCount="indefinite" keyTimes="0;0.26;0.3;0.96;0.965;1" values="160 200;160 200;280 100;280 100;160 200;160 200"/><rect x="0" y="0" width="40" height="34" rx="4" class="box"/><text x="20" y="22" class="t" text-anchor="middle">10</text></g><g transform="translate(200 200)"><animateTransform attributeName="transform" type="translate" dur="16s" repeatCount="indefinite" keyTimes="0;0.26;0.3;0.96;0.965;1" values="200 200;200 200;300 200;300 200;200 200;200 200"/><rect x="0" y="0" width="40" height="34" rx="4" class="box"/><text x="20" y="22" class="t" text-anchor="middle">15</text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.628;0.64;0.9;0.912;1" values="0;0;1;1;0;0"/><rect x="-2" y="-2" width="44" height="38" rx="5" class="ring-g"/></g></g><g transform="translate(300 100)"><animateTransform attributeName="transform" type="translate" dur="16s" repeatCount="indefinite" keyTimes="0;0.26;0.3;0.96;0.965;1" values="300 100;300 100;320 100;320 100;300 100;300 100"/><rect x="0" y="0" width="40" height="34" rx="4" class="box"/><text x="20" y="22" class="t" text-anchor="middle">20</text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.688;0.7;0.9;0.912;1" values="0;0;1;1;0;0"/><rect x="-2" y="-2" width="44" height="38" rx="5" class="ring-g"/></g></g><g transform="translate(420 200)"><animateTransform attributeName="transform" type="translate" dur="16s" repeatCount="indefinite" keyTimes="0;1" values="420 200;420 200"/><rect x="0" y="0" width="40" height="34" rx="4" class="box"/><text x="20" y="22" class="t" text-anchor="middle">30</text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.748;0.76;0.9;0.912;1" values="0;0;1;1;0;0"/><rect x="-2" y="-2" width="44" height="38" rx="5" class="ring-g"/></g></g><g transform="translate(460 200)"><animateTransform attributeName="transform" type="translate" dur="16s" repeatCount="indefinite" keyTimes="0;1" values="460 200;460 200"/><rect x="0" y="0" width="40" height="34" rx="4" class="box"/><text x="20" y="22" class="t" text-anchor="middle">40</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.03;0.05;0.95;0.96;1" values="0;0;1;1;0;0"/><g transform="translate(380 50)"><animateTransform attributeName="transform" type="translate" dur="16s" repeatCount="indefinite" keyTimes="0;0.04;0.1;0.3;0.36;0.46;0.5;1" values="380 50;380 50;220 140;220 140;290 140;290 140;260 200;260 200"/><rect x="0" y="0" width="40" height="34" rx="4" class="hl"/><text x="20" y="22" class="t orange" text-anchor="middle">12</text><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.568;0.58;0.9;0.912;1" values="0;0;1;1;0;0"/><rect x="-2" y="-2" width="44" height="38" rx="5" class="ring-g"/></g></g></g><g opacity="1"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.035;0.047;1" values="1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">NewBTree[int, string](2): every node holds at most 2t-1 = 3 keys</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.028;0.04;0.13;0.142;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">Insert(12): 12 &lt; 20 → descend into child 0</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.128;0.14;0.26;0.272;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">child is full (3 keys) → splitChild before descending</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.258;0.27;0.36;0.372;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">median 10 moves up; [5] and [15] become siblings</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.358;0.37;0.48;0.492;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">10 &lt; 12 &lt; 20 → descend into [15]</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.478;0.49;0.57;0.582;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">leaf has room → insert 12 in key order</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.568;0.58;0.92;0.932;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">Range(12, 30) yields keys in order</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.568;0.58;0.92;0.932;1" values="0;0;1;1;0;0"/><text x="24" y="300" class="m" text-anchor="start">Range(12, 30):</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.568;0.58;0.92;0.932;1" values="0;0;1;1;0;0"/><text x="140" y="300" class="t green" text-anchor="start">12</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.628;0.64;0.92;0.932;1" values="0;0;1;1;0;0"/><text x="174" y="300" class="t green" text-anchor="start">15</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.688;0.7;0.92;0.932;1" values="0;0;1;1;0;0"/><text x="208" y="300" class="t green" text-anchor="start">20</text></g><g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0.748;0.76;0.92;0.932;1" values="0;0;1;1;0;0"/><text x="242" y="300" class="t green" text-anchor="start">30</text></g><text x="24" y="336" class="s" text-anchor="start">Proactive splits keep every leaf at the same depth: Insert, Search, Delete are O(log n)</text></g></svg>
