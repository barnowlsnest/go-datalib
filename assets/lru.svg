<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">pkg/lru</title><desc id="desc">Keys 1 to 3 are put into the cache, key 1 is read and moves to the head, then key 4 evicts key 2 from the tail.</desc><style>
svg{--bg:#ffffff;--card:#f6f8fa;--stroke:#d0d7de;--fg:#1f2328;--muted:#59636e;--blue:#0969da;--green:#1a7f37;--orange:#bc4c00;--red:#cf222e;--purple:#8250df}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--card:#161b22;--stroke:#3d444d;--fg:#e6edf3;--muted:#9198a1;--blue:#4493f8;--green:#3fb950;--orange:#f0883e;--red:#f85149;--purple:#ab7df8}}
.bg{fill:var(--bg);stroke:var(--stroke)}
.box{fill:var(--card);stroke:var(--stroke);stroke-width:1.5}
.slot{fill:none;stroke:var(--stroke);stroke-width:1.5;stroke-dasharray:5 4}
.grp{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:6 4}
.div{stroke:var(--stroke);stroke-width:1.5}
.h{fill:var(--fg);font:600 16px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.s{fill:var(--muted);font:13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.t{fill:var(--fg);font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.c{fill:var(--fg);font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.m{fill:var(--muted);font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.blue{fill:var(--blue)}.green{fill:var(--green)}.orange{fill:var(--orange)}.red{fill:var(--red)}.purple{fill:var(--purple)}
.e{stroke:var(--muted);stroke-width:1.6;fill:none}
.eb{stroke:var(--blue);stroke-width:1.6;fill:none}
.ep{stroke:var(--purple);stroke-width:1.6;fill:none}
.ring-o{fill:none;stroke:var(--orange);stroke-width:3}
.ring-g{fill:var(--green);fill-opacity:.18;stroke:var(--green);stroke-width:2.5}
.ring-r{fill:none;stroke:var(--red);stroke-width:3}
.hatch{fill:url(#hatch);stroke:var(--stroke)}
.hl{fill:var(--orange);fill-opacity:.15;stroke:var(--orange);stroke-width:2}
.mk-m{fill:var(--muted)}.mk-b{fill:var(--blue)}.mk-p{fill:var(--purple)}
</style><defs>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-m" d="M0 0L10 5L0 10z"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-b" d="M0 0L10 5L0 10z"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-p" d="M0 0L10 5L0 10z"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--muted);stroke-width:1.5;opacity:.6"/></pattern>
</defs><rect class="bg" x="0.5" y="0.5" width="639" height="299" rx="12"/><text x="24" y="34" class="h" text-anchor="start">pkg/lru</text><text x="24" y="54" class="s" text-anchor="start">Least-recently-used cache, capacity 3</text><rect x="150" y="130" width="110" height="56" rx="10" class="slot"/><rect x="290" y="130" width="110" height="56" rx="10" class="slot"/><line x1="261" y1="158" x2="289" y2="158" class="e" marker-start="url(#am)" marker-end="url(#am)"/><rect x="430" y="130" width="110" height="56" rx="10" class="slot"/><line x1="401" y1="158" x2="429" y2="158" class="e" marker-start="url(#am)" marker-end="url(#am)"/><text x="205" y="208" class="m" text-anchor="middle">head · MRU</text><text x="485" y="208" class="m" text-anchor="middle">tail · LRU</text><text x="40" y="164" class="m" text-anchor="start">usage</text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.04;0.08;0.92;0.95;1" values="0;0;1;1;0;0"/><g transform="translate(150 70)"><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" keyTimes="0;0.04;0.08;0.16;0.2;0.28;0.32;0.42;0.44;0.46;0.62;0.66;0.97;0.98;1" values="150 70;150 70;150 130;150 130;290 130;290 130;430 130;430 130;290 75;150 130;150 130;290 130;290 130;150 70;150 70"/><rect x="0" y="0" width="110" height="56" rx="10" class="box"/><text x="55" y="25" class="t" text-anchor="middle">key 1</text><text x="55" y="43" class="m" text-anchor="middle">value a</text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.408;0.42;0.52;0.532;1" values="0;0;1;1;0;0"/><rect x="-4" y="-4" width="118" height="64" rx="12" class="ring-o"/></g></g></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.16;0.2;0.58;0.62;1" values="0;0;1;1;0;0"/><g transform="translate(150 70)"><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" keyTimes="0;0.16;0.2;0.28;0.32;0.42;0.46;0.58;0.62;0.97;0.98;1" values="150 70;150 70;150 130;150 130;290 130;290 130;430 130;430 130;550 130;550 130;150 70;150 70"/><rect x="0" y="0" width="110" height="56" rx="10" class="box"/><text x="55" y="25" class="t" text-anchor="middle">key 2</text><text x="55" y="43" class="m" text-anchor="middle">value b</text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.538;0.55;0.62;0.632;1" values="0;0;1;1;0;0"/><rect x="-4" y="-4" width="118" height="64" rx="12" class="ring-r"/></g></g></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.28;0.32;0.92;0.95;1" values="0;0;1;1;0;0"/><g transform="translate(150 70)"><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" keyTimes="0;0.28;0.32;0.42;0.46;0.62;0.66;0.97;0.98;1" values="150 70;150 70;150 130;150 130;290 130;290 130;430 130;430 130;150 70;150 70"/><rect x="0" y="0" width="110" height="56" rx="10" class="box"/><text x="55" y="25" class="t" text-anchor="middle">key 3</text><text x="55" y="43" class="m" text-anchor="middle">value c</text></g></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.66;0.7;0.92;0.95;1" values="0;0;1;1;0;0"/><g transform="translate(150 70)"><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" keyTimes="0;0.66;0.7;1" values="150 70;150 70;150 130;150 130"/><rect x="0" y="0" width="110" height="56" rx="10" class="box"/><text x="55" y="25" class="t" text-anchor="middle">key 4</text><text x="55" y="43" class="m" text-anchor="middle">value d</text></g></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.028;0.04;0.15;0.162;1" values="0;0;1;1;0;0"/><text x="24" y="90" class="c orange" text-anchor="start">Put(1, a)  → new key: Unshift at head</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.148;0.16;0.27;0.282;1" values="0;0;1;1;0;0"/><text x="24" y="90" class="c orange" text-anchor="start">Put(2, b)  → new key: Unshift at head</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.268;0.28;0.41;0.422;1" values="0;0;1;1;0;0"/><text x="24" y="90" class="c orange" text-anchor="start">Put(3, c)  → cache is now full (3/3)</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.408;0.42;0.57;0.582;1" values="0;0;1;1;0;0"/><text x="24" y="90" class="c orange" text-anchor="start">Get(1)     → hit: MoveToHead(key 1)</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.568;0.58;0.94;0.952;1" values="0;0;1;1;0;0"/><text x="24" y="90" class="c orange" text-anchor="start">Put(4, d)  → full: evict tail (key 2), Unshift key 4</text></g><text x="24" y="280" class="s" text-anchor="start">map[uint64]*entry gives O(1) lookup · list order tracks recency · guarded by sync.Mutex</text></svg>
