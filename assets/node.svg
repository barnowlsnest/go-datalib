<svg xmlns="http://www.w3.org/2000/svg" width="640" height="270" viewBox="0 0 640 270" role="img" aria-labelledby="title desc"><title id="title">pkg/node</title><desc id="desc">Three linked nodes; an iterator cursor walks forward via next pointers, then backward via prev pointers.</desc><style>
svg{--bg:#ffffff;--card:#f6f8fa;--stroke:#d0d7de;--fg:#1f2328;--muted:#59636e;--blue:#0969da;--green:#1a7f37;--orange:#bc4c00;--red:#cf222e;--purple:#8250df}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--card:#161b22;--stroke:#3d444d;--fg:#e6edf3;--muted:#9198a1;--blue:#4493f8;--green:#3fb950;--orange:#f0883e;--red:#f85149;--purple:#ab7df8}}
.bg{fill:var(--bg);stroke:var(--stroke)}
.box{fill:var(--card);stroke:var(--stroke);stroke-width:1.5}
.slot{fill:none;stroke:var(--stroke);stroke-width:1.5;stroke-dasharray:5 4}
.grp{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:6 4}
.div{stroke:var(--stroke);stroke-width:1.5}
.h{fill:var(--fg);font:600 16px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.s{fill:var(--muted);font:13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.t{fill:var(--fg);font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.c{fill:var(--fg);font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.m{fill:var(--muted);font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.blue{fill:var(--blue)}.green{fill:var(--green)}.orange{fill:var(--orange)}.red{fill:var(--red)}.purple{fill:var(--purple)}
.e{stroke:var(--muted);stroke-width:1.6;fill:none}
.eb{stroke:var(--blue);stroke-width:1.6;fill:none}
.ep{stroke:var(--purple);stroke-width:1.6;fill:none}
.ring-o{fill:none;stroke:var(--orange);stroke-width:3}
.ring-g{fill:var(--green);fill-opacity:.18;stroke:var(--green);stroke-width:2.5}
.ring-r{fill:none;stroke:var(--red);stroke-width:3}
.hatch{fill:url(#hatch);stroke:var(--stroke)}
.hl{fill:var(--orange);fill-opacity:.15;stroke:var(--orange);stroke-width:2}
.mk-m{fill:var(--muted)}.mk-b{fill:var(--blue)}.mk-p{fill:var(--purple)}
</style><defs>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-m" d="M0 0L10 5L0 10z"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-b" d="M0 0L10 5L0 10z"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-p" d="M0 0L10 5L0 10z"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--muted);stroke-width:1.5;opacity:.6"/></pattern>
</defs><rect class="bg" x="0.5" y="0.5" width="639" height="269" rx="12"/><text x="24" y="34" class="h" text-anchor="start">pkg/node</text><text x="24" y="54" class="s" text-anchor="start">Doubly-linked nodes with an immutable ID; iterate forward or backward</text><rect x="50" y="120" width="160" height="56" rx="8" class="box"/><line x1="90" y1="120" x2="90" y2="176" class="div"/><line x1="170" y1="120" x2="170" y2="176" class="div"/><text x="70" y="146" class="m" text-anchor="middle">prev</text><text x="70" y="164" class="m" text-anchor="middle">nil</text><text x="130" y="154" class="t" text-anchor="middle">ID 1</text><text x="190" y="146" class="m" text-anchor="middle">next</text><text x="190" y="164" class="m" text-anchor="middle">•</text><rect x="240" y="120" width="160" height="56" rx="8" class="box"/><line x1="280" y1="120" x2="280" y2="176" class="div"/><line x1="360" y1="120" x2="360" y2="176" class="div"/><text x="260" y="146" class="m" text-anchor="middle">prev</text><text x="260" y="164" class="m" text-anchor="middle">•</text><text x="320" y="154" class="t" text-anchor="middle">ID 2</text><text x="380" y="146" class="m" text-anchor="middle">next</text><text x="380" y="164" class="m" text-anchor="middle">•</text><rect x="430" y="120" width="160" height="56" rx="8" class="box"/><line x1="470" y1="120" x2="470" y2="176" class="div"/><line x1="550" y1="120" x2="550" y2="176" class="div"/><text x="450" y="146" class="m" text-anchor="middle">prev</text><text x="450" y="164" class="m" text-anchor="middle">•</text><text x="510" y="154" class="t" text-anchor="middle">ID 3</text><text x="570" y="146" class="m" text-anchor="middle">next</text><text x="570" y="164" class="m" text-anchor="middle">nil</text><path class="eb" marker-end="url(#ab)" d="M190 120 C190 82 320 82 320 117"/><path class="ep" marker-end="url(#ap)" d="M260 176 C260 214 130 214 130 179"/><path class="eb" marker-end="url(#ab)" d="M380 120 C380 82 510 82 510 117"/><path class="ep" marker-end="url(#ap)" d="M450 176 C450 214 320 214 320 179"/><text x="250" y="86" class="m blue" text-anchor="middle">WithNext()</text><text x="250" y="220" class="m purple" text-anchor="middle">WithPrev()</text><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.03;0.9;0.93;1" values="0;1;1;0;0"/><g transform="translate(0 0)"><animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" keyTimes="0;0.13;0.17;0.25;0.29;0.6;0.64;0.72;0.76;1" values="0 0;0 0;190 0;190 0;380 0;380 0;190 0;190 0;0 0;0 0"/><rect x="43" y="113" width="174" height="70" rx="10" class="hl"/></g></g><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.008;0.02;0.46;0.472;1" values="0;0;1;1;0;0"/><text x="24" y="236" class="c" text-anchor="start">for i, n := range node.NextNodes(head) {</text></g><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.488;0.5;0.92;0.932;1" values="0;0;1;1;0;0"/><text x="24" y="236" class="c" text-anchor="start">for i, n := range node.PrevNodes(tail) {</text></g><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.018;0.03;0.15;0.162;1" values="0;0;1;1;0;0"/><text x="24" y="256" class="m orange" text-anchor="start">// i=0  n.ID()=1</text></g><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.158;0.17;0.27;0.282;1" values="0;0;1;1;0;0"/><text x="24" y="256" class="m orange" text-anchor="start">// i=1  n.ID()=2</text></g><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.278;0.29;0.46;0.472;1" values="0;0;1;1;0;0"/><text x="24" y="256" class="m orange" text-anchor="start">// i=2  n.ID()=3</text></g><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.488;0.5;0.62;0.632;1" values="0;0;1;1;0;0"/><text x="24" y="256" class="m orange" text-anchor="start">// i=0  n.ID()=3</text></g><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.628;0.64;0.74;0.752;1" values="0;0;1;1;0;0"/><text x="24" y="256" class="m orange" text-anchor="start">// i=1  n.ID()=2</text></g><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.748;0.76;0.92;0.932;1" values="0;0;1;1;0;0"/><text x="24" y="256" class="m orange" text-anchor="start">// i=2  n.ID()=1</text></g></svg>
