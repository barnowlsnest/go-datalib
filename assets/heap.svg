te" keyTimes="0;1" values="200 175;200 175"/><circle cx="0" cy="0" r="20" class="box"/><text x="0" y="5" class="t" text-anchor="middle">5</text></g><g transform="translate(172 286)"><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" keyTimes="0;1" values="172 286;172 286"/><rect x="0" y="0" width="52" height="32" rx="6" class="box"/><text x="26" y="21" class="t" text-anchor="middle">5</text></g><g transform="translate(140 233)"><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" keyTimes="0;1" values="140 233;140 233"/><circle cx="0" cy="0" r="20" class="box"/><text x="0" y="5" class="t" text-anchor="middle">9</text></g><g transform="translate(296 286)"><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" keyTimes="0;1" values="296 286;296 286"/><rect x="0" y="0" width="52" height="32" rx="6" class="box"/><text x="26" y="21" class="t" text-anchor="middle">9</text></g><g transform="translate(260 233)"><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" keyTimes="0;1" values="260 233;260 233"/><circle cx="0" cy="0" r="20" class="box"/><text x="0" y="5" class="t" text-anchor="middle">6</text></g><g transform="translate(358 286)"><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" keyTimes="0;1" values="358 286;358 286"/><rect x="0" y="0" width="52" height="32" rx="6" class="box"/><text x="26" y="21" class="t" text-anchor="middle">6</text></g><g transform="translate(380 233)"><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" keyTimes="0;1" values="380 233;380 233"/><circle cx="0" cy="0" r="20" class="box"/><text x="0" y="5" class="t" text-anchor="middle">8</text></g><g transform="translate(420 286)"><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" keyTimes="0;1" values="420 286;420 286"/><rect x="0" y="0" width="52" height="32" rx="6" class="box"/><text x="26" y="21" class="t" text-anchor="middle">8</text></g><g transform="translate(320 117)"><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" keyTimes="0;0.3;0.34;0.68;0.72;1" values="320 117;320 117;440 175;440 175;320 117;320 117"/><circle cx="0" cy="0" r="20" class="box"/><text x="0" y="5" class="t" text-anchor="middle">2</text></g><g transform="translate(110 286)"><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" keyTimes="0;0.3;0.34;0.68;0.72;1" values="110 286;110 286;234 286;234 286;110 286;110 286"/><rect x="0" y="0" width="52" height="32" rx="6" class="box"/><text x="26" y="21" class="t" text-anchor="middle">2</text></g><g transform="translate(440 175)"><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" keyTimes="0;0.18;0.22;0.56;0.6;0.68;0.72;1" values="440 175;440 175;500 233;500 233;320 117;320 117;440 175;440 175"/><circle cx="0" cy="0" r="20" class="box"/><text x="0" y="5" class="t" text-anchor="middle">3</text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.548;0.56;0.74;0.752;1" values="0;0;1;1;0;0"/><circle cx="0" cy="0" r="24" class="ring-o"/></g></g><g transform="translate(234 286)"><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" keyTimes="0;0.18;0.22;0.56;0.6;0.68;0.72;1" values="234 286;234 286;482 286;482 286;110 286;110 286;234 286;234 286"/><rect x="0" y="0" width="52" height="32" rx="6" class="box"/><text x="26" y="21" class="t" text-anchor="middle">3</text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.548;0.56;0.74;0.752;1" values="0;0;1;1;0;0"/><rect x="-3" y="-3" width="58" height="38" rx="8" class="ring-o"/></g></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.06;0.09;0.48;0.53;1" values="0;0;1;1;0;0"/><g transform="translate(500 233)"><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" keyTimes="0;0.18;0.22;0.3;0.34;0.48;0.53;1" values="500 233;500 233;440 175;440 175;320 117;320 117;320 85;320 85"/><circle cx="0" cy="0" r="20" class="box"/><text x="0" y="5" class="t orange" text-anchor="middle">1</text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.088;0.1;0.36;0.372;1" values="0;0;1;1;0;0"/><circle cx="0" cy="0" r="24" class="ring-o"/></g></g></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.06;0.09;0.48;0.53;1" values="0;0;1;1;0;0"/><g transform="translate(482 286)"><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" keyTimes="0;0.18;0.22;0.3;0.34;0.48;0.53;1" values="482 286;482 286;234 286;234 286;110 286;110 286;110 326;110 326"/><rect x="0" y="0" width="52" height="32" rx="6" class="box"/><text x="26" y="21" class="t orange" text-anchor="middle">1</text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.088;0.1;0.36;0.372;1" values="0;0;1;1;0;0"/><rect x="-3" y="-3" width="58" height="38" rx="8" class="ring-o"/></g></g></g><g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.055;0.067;0.918;0.93;1" values="1;1;0;0;1;1"/><text x="24" y="80" class="c" text-anchor="start">NewMin[int](): every parent ≤ its children</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.048;0.06;0.16;0.172;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">Push(1): append to the slice at index 6</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.158;0.17;0.28;0.292;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">bubbleUp: 1 &lt; parent 3 (index 2) → swap</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.278;0.29;0.46;0.472;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">bubbleUp: 1 &lt; parent 2 (index 0) → swap, new root</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.468;0.48;0.58;0.592;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">Pop() → 1: move last element (3) to the root</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.578;0.59;0.72;0.732;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">bubbleDown: smaller child 2 &lt; 3 → swap</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.718;0.73;0.92;0.932;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">bubbleDown: 3 ≤ child 8 → heap property restored</text></g><text x="24" y="356" class="s" text-anchor="start">parent(i) = (i-1)/2 · children 2i+1, 2i+2 · Push/Pop O(log n), Peek O(1)</text></svg>
