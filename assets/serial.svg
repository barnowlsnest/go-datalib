<svg xmlns="http://www.w3.org/2000/svg" width="640" height="370" viewBox="0 0 640 370" role="img" aria-labelledby="title desc"><title id="title">pkg/serial</title><desc id="desc">Each Next(key) call hashes the key to one of 64 cache-line-padded shards and atomically increments that shard's counter.</desc><style>
svg{--bg:#ffffff;--card:#f6f8fa;--stroke:#d0d7de;--fg:#1f2328;--muted:#59636e;--blue:#0969da;--green:#1a7f37;--orange:#bc4c00;--red:#cf222e;--purple:#8250df}
