.bg{fill:var(--bg);stroke:var(--stroke)}
.box{fill:var(--card);stroke:var(--stroke);stroke-width:1.5}
.slot{fill:none;stroke:var(--stroke);stroke-width:1.5;stroke-dasharray:5 4}
.grp{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:6 4}
.div{stroke:var(--stroke);stroke-width:1.5}
.h{fill:var(--fg);font:600 16px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.s{fill:var(--muted);font:13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.t{fill:var(--fg);font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.c{fill:var(--fg);font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.m{fill:var(--muted);font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.blue{fill:var(--blue)}.green{fill:var(--green)}.orange{fill:var(--orange)}.red{fill:var(--red)}.purple{fill:var(--purple)}
.e{stroke:var(--muted);stroke-width:1.6;fill:none}
.eb{stroke:var(--blue);stroke-width:1.6;fill:none}
.ep{stroke:var(--purple);stroke-width:1.6;fill:none}
.ring-o{fill:none;stroke:var(--orange);stroke-width:3}
.ring-g{fill:var(--green);fill-opacity:.18;stroke:var(--green);stroke-width:2.5}
.ring-r{fill:none;stroke:var(--red);stroke-width:3}
.hatch{fill:url(#hatch);stroke:var(--stroke)}
.hl{fill:var(--orange);fill-opacity:.15;stroke:var(--orange);stroke-width:2}
.mk-m{fill:var(--muted)}.mk-b{fill:var(--blue)}.mk-p{fill:var(--purple)}
