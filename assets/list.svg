<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" role="img" aria-labelledby="title desc"><title id="title">pkg/list</title><desc id="desc">A stack pushes and pops node D at the tail; a queue enqueues D at the rear and dequeues A from the front.</desc><style>
svg{--bg:#ffffff;--card:#f6f8fa;--stroke:#d0d7de;--fg:#1f2328;--muted:#59636e;--blue:#0969da;--green:#1a7f37;--orange:#bc4c00;--red:#cf222e;--purple:#8250df}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--card:#161b22;--stroke:#3d444d;--fg:#e6edf3;--muted:#9198a1;--blue:#4493f8;--green:#3fb950;--orange:#f0883e;--red:#f85149;--purple:#ab7df8}}
.bg{fill:var(--bg);stroke:var(--stroke)}
.box{fill:var(--card);stroke:var(--stroke);stroke-width:1.5}
.slot{fill:none;stroke:var(--stroke);stroke-width:1.5;stroke-dasharray:5 4}
.grp{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:6 4}
.div{stroke:var(--stroke);stroke-width:1.5}
.h{fill:var(--fg);font:600 16px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.s{fill:var(--muted);font:13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.t{fill:var(--fg);font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.c{fill:var(--fg);font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.m{fill:var(--muted);font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.blue{fill:var(--blue)}.green{fill:var(--green)}.orange{fill:var(--orange)}.red{fill:var(--red)}.purple{fill:var(--purple)}
.e{stroke:var(--muted);stroke-width:1.6;fill:none}
.eb{stroke:var(--blue);stroke-width:1.6;fill:none}
.ep{stroke:var(--purple);stroke-width:1.6;fill:none}
.ring-o{fill:none;stroke:var(--orange);stroke-width:3}
.ring-g{fill:var(--green);fill-opacity:.18;stroke:var(--green);stroke-width:2.5}
.ring-r{fill:none;stroke:var(--red);stroke-width:3}
.hatch{fill:url(#hatch);stroke:var(--stroke)}
.hl{fill:var(--orange);fill-opacity:.15;stroke:var(--orange);stroke-width:2}
.mk-m{fill:var(--muted)}.mk-b{fill:var(--blue)}.mk-p{fill:var(--purple)}
</style><defs>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-m" d="M0 0L10 5L0 10z"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-b" d="M0 0L10 5L0 10z"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-p" d="M0 0L10 5L0 10z"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--muted);stroke-width:1.5;opacity:.6"/></pattern>
</defs><rect class="bg" x="0.5" y="0.5" width="639" height="329" rx="12"/><text x="24" y="34" class="h" text-anchor="start">pkg/list</text><text x="24" y="54" class="s" text-anchor="start">LinkedList with O(1) ends, plus Stack and Queue built on top of it</text><text x="24" y="88" class="c" text-anchor="start">Stack (LIFO) — Push / Pop at the tail</text><rect x="60" y="110" width="70" height="44" rx="8" class="box"/><text x="95" y="138" class="t" text-anchor="middle">A</text><rect x="150" y="110" width="70" height="44" rx="8" class="box"/><text x="185" y="138" class="t" text-anchor="middle">B</text><line x1="131" y1="132" x2="149" y2="132" class="e" marker-start="url(#am)" marker-end="url(#am)"/><rect x="240" y="110" width="70" height="44" rx="8" class="box"/><text x="275" y="138" class="t" text-anchor="middle">C</text><line x1="221" y1="132" x2="239" y2="132" class="e" marker-start="url(#am)" marker-end="url(#am)"/><text x="95" y="102" class="m" text-anchor="middle">head</text><g transform="translate(0 0)"><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" keyTimes="0;0.08;0.14;0.36;0.42;1" values="0 0;0 0;90 0;90 0;0 0;0 0"/><text x="275" y="102" class="m" text-anchor="middle">tail</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.08;0.14;0.36;0.42;1" values="0;0;1;1;0;0"/><g transform="translate(0 -50)"><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" keyTimes="0;0.08;0.14;0.36;0.42;1" values="0 -50;0 -50;0 0;0 0;0 -50;0 -50"/><rect x="330" y="110" width="70" height="44" rx="8" class="box"/><text x="365" y="138" class="t" text-anchor="middle">D</text><line x1="311" y1="132" x2="329" y2="132" class="e" marker-start="url(#am)" marker-end="url(#am)"/></g></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.068;0.08;0.34;0.352;1" values="0;0;1;1;0;0"/><text x="450" y="138" class="c orange" text-anchor="start">Push(D)</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.348;0.36;0.48;0.492;1" values="0;0;1;1;0;0"/><text x="450" y="138" class="c orange" text-anchor="start">Pop() → D</text></g><text x="24" y="208" class="c" text-anchor="start">Queue (FIFO) — Enqueue at rear, Dequeue from front</text><g opacity="1"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.68;0.74;0.98;1" values="1;1;0;0;1"/><g transform="translate(0 0)"><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" keyTimes="0;0.68;0.76;0.96;0.97;1" values="0 0;0 0;-60 0;-60 0;0 0;0 0"/><rect x="60" y="230" width="70" height="44" rx="8" class="box"/><text x="95" y="258" class="t" text-anchor="middle">A</text><line x1="131" y1="252" x2="149" y2="252" class="e" marker-start="url(#am)" marker-end="url(#am)"/></g></g><g opacity="1"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.94;0.96;0.98;1" values="1;1;0;0;1"/><g transform="translate(0 0)"><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" keyTimes="0;0.76;0.84;0.96;0.97;1" values="0 0;0 0;-90 0;-90 0;0 0;0 0"/><rect x="150" y="230" width="70" height="44" rx="8" class="box"/><text x="185" y="258" class="t" text-anchor="middle">B</text></g></g><g opacity="1"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.94;0.96;0.98;1" values="1;1;0;0;1"/><g transform="translate(0 0)"><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" keyTimes="0;0.76;0.84;0.96;0.97;1" values="0 0;0 0;-90 0;-90 0;0 0;0 0"/><rect x="240" y="230" width="70" height="44" rx="8" class="box"/><text x="275" y="258" class="t" text-anchor="middle">C</text><line x1="221" y1="252" x2="239" y2="252" class="e" marker-start="url(#am)" marker-end="url(#am)"/></g></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.52;0.58;0.94;0.96;1" values="0;0;1;1;0;0"/><g transform="translate(120 0)"><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" keyTimes="0;0.52;0.6;0.76;0.84;0.96;0.97;1" values="120 0;120 0;0 0;0 0;-90 0;-90 0;120 0;120 0"/><rect x="330" y="230" width="70" height="44" rx="8" class="box"/><text x="365" y="258" class="t" text-anchor="middle">D</text><line x1="311" y1="252" x2="329" y2="252" class="e" marker-start="url(#am)" marker-end="url(#am)"/></g></g><text x="95" y="222" class="m" text-anchor="middle">front</text><g transform="translate(0 0)"><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" keyTimes="0;0.52;0.6;0.76;0.84;1" values="0 0;0 0;90 0;90 0;0 0;0 0"/><text x="275" y="222" class="m" text-anchor="middle">rear</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.508;0.52;0.66;0.672;1" values="0;0;1;1;0;0"/><text x="450" y="258" class="c orange" text-anchor="start">Enqueue(D)</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.668;0.68;0.94;0.952;1" values="0;0;1;1;0;0"/><text x="450" y="258" class="c orange" text-anchor="start">Dequeue() → A</text></g><text x="24" y="310" class="s" text-anchor="start">Both wrap list.LinkedList: Push/Pop/Unshift/Shift are O(1) at either end.</text></svg>
