teName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.64;0.652;0.948;0.96;1" values="1;1;0;0;1;1"/><text x="320" y="165" class="c" text-anchor="end">t[4]=11</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.628;0.64;0.94;0.952;1" values="0;0;1;1;0;0"/><text x="320" y="165" class="c" text-anchor="end">t[4]=15</text></g><rect x="334" y="232" width="60" height="32" rx="6" class="box"/><text x="386" y="253" class="c" text-anchor="end">t[5]=4</text><rect x="334" y="188" width="126" height="32" rx="6" class="box"/><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.128;0.14;0.46;0.472;1" values="0;0;1;1;0;0"/><rect x="334" y="188" width="126" height="32" rx="6" class="ring-g"/></g><text x="452" y="209" class="c" text-anchor="end">t[6]=10</text><rect x="466" y="232" width="60" height="32" rx="6" class="box"/><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.028;0.04;0.46;0.472;1" values="0;0;1;1;0;0"/><rect x="466" y="232" width="60" height="32" rx="6" class="ring-g"/></g><text x="518" y="253" class="c" text-anchor="end">t[7]=2</text><rect x="70" y="100" width="522" height="32" rx="6" class="box"/><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.708;0.72;0.94;0.952;1" values="0;0;1;1;0;0"/><rect x="70" y="100" width="522" height="32" rx="6" class="hl"/></g><g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.74;0.752;0.948;0.96;1" values="1;1;0;0;1;1"/><text x="584" y="121" class="c" text-anchor="end">t[8]=30</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.728;0.74;0.94;0.952;1" values="0;0;1;1;0;0"/><text x="584" y="121" class="c" text-anchor="end">t[8]=34</text></g><rect x="70" y="286" width="60" height="32" rx="6" class="slot"/><text x="100" y="307" class="t" text-anchor="middle">3</text><text x="100" y="334" class="m" text-anchor="middle">1·0001</text><rect x="136" y="286" width="60" height="32" rx="6" class="slot"/><text x="166" y="307" class="t" text-anchor="middle">2</text><text x="166" y="334" class="m" text-anchor="middle">2·0010</text><rect x="202" y="286" width="60" height="32" rx="6" class="slot"/><g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.52;0.532;0.948;0.96;1" values="1;1;0;0;1;1"/><text x="232" y="307" class="t" text-anchor="middle">5</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.508;0.52;0.94;0.952;1" values="0;0;1;1;0;0"/><text x="232" y="307" class="t" text-anchor="middle">9</text></g><text x="232" y="334" class="m" text-anchor="middle">3·0011</text><rect x="268" y="286" width="60" height="32" rx="6" class="slot"/><text x="298" y="307" class="t" text-anchor="middle">1</text><text x="298" y="334" class="m" text-anchor="middle">4·0100</text><rect x="334" y="286" width="60" height="32" rx="6" class="slot"/><text x="364" y="307" class="t" text-anchor="middle">4</text><text x="364" y="334" class="m" text-anchor="middle">5·0101</text><rect x="400" y="286" width="60" height="32" rx="6" class="slot"/><text x="430" y="307" class="t" text-anchor="middle">6</text><text x="430" y="334" class="m" text-anchor="middle">6·0110</text><rect x="466" y="286" width="60" height="32" rx="6" class="slot"/><text x="496" y="307" class="t" text-anchor="middle">2</text><text x="496" y="334" class="m" text-anchor="middle">7·0111</text><rect x="532" y="286" width="60" height="32" rx="6" class="slot"/><text x="562" y="307" class="t" text-anchor="middle">7</text><text x="562" y="334" class="m" text-anchor="middle">8·1000</text><text x="60" y="307" class="m" text-anchor="end">a[i]</text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.328;0.34;0.46;0.472;1" values="0;0;1;1;0;0"/><path class="eb" d="M70 280 V276 H526 V280"/></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.028;0.04;0.135;0.147;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">Query(7): i=7 (0111) sum += t[7] → 2; i -= i&amp;-i → 6</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.128;0.14;0.235;0.247;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">Query(7): i=6 (0110) sum += t[6] → 12; i -= i&amp;-i → 4</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.228;0.24;0.335;0.347;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">Query(7): i=4 (0100) sum += t[4] → 23; i -= i&amp;-i → 0</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.328;0.34;0.46;0.472;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">Query(7) = 23: sum of a[1..7] in log₂(n) steps</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.508;0.52;0.615;0.627;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">Update(3, +4): t[3] += 4; i += i&amp;-i → 4</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.608;0.62;0.715;0.727;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">Update(3, +4): t[4] += 4; i += i&amp;-i → 8</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.708;0.72;0.935;0.947;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">Update(3, +4): t[8] += 4; i += i&amp;-i → 16 &gt; n, stop</text></g><text x="24" y="362" class="s" text-anchor="start">t[i] stores the sum of the (i &amp; -i) elements ending at i</text></svg>
