<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">pkg/dag</title><desc id="desc">Nodes with in-degree zero are dequeued one by one, removing their edges, until every node is drained, proving the graph is acyclic.</desc><style>
svg{--bg:#ffffff;--card:#f6f8fa;--stroke:#d0d7de;--fg:#1f2328;--muted:#59636e;--blue:#0969da;--green:#1a7f37;--orange:#bc4c00;--red:#cf222e;--purple:#8250df}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--card:#161b22;--stroke:#3d444d;--fg:#e6edf3;--muted:#9198a1;--blue:#4493f8;--green:#3fb950;--orange:#f0883e;--red:#f85149;--purple:#ab7df8}}
.bg{fill:var(--bg);stroke:var(--stroke)}
.box{fill:var(--card);stroke:var(--stroke);stroke-width:1.5}
.slot{fill:none;stroke:var(--stroke);stroke-width:1.5;stroke-dasharray:5 4}
.grp{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:6 4}
.div{stroke:var(--stroke);stroke-width:1.5}
.h{fill:var(--fg);font:600 16px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.s{fill:var(--muted);font:13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.t{fill:var(--fg);font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.c{fill:var(--fg);font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.m{fill:var(--muted);font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.blue{fill:var(--blue)}.green{fill:var(--green)}.orange{fill:var(--orange)}.red{fill:var(--red)}.purple{fill:var(--purple)}
.e{stroke:var(--muted);stroke-width:1.6;fill:none}
.eb{stroke:var(--blue);stroke-width:1.6;fill:none}
.ep{stroke:var(--purple);stroke-width:1.6;fill:none}
.ring-o{fill:none;stroke:var(--orange);stroke-width:3}
.ring-g{fill:var(--green);fill-opacity:.18;stroke:var(--green);stroke-width:2.5}
.ring-r{fill:none;stroke:var(--red);stroke-width:3}
.hatch{fill:url(#hatch);stroke:var(--stroke)}
.hl{fill:var(--orange);fill-opacity:.15;stroke:var(--orange);stroke-width:2}
.mk-m{fill:var(--muted)}.mk-b{fill:var(--blue)}.mk-p{fill:var(--purple)}
</style><defs>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-m" d="M0 0L10 5L0 10z"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-b" d="M0 0L10 5L0 10z"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-p" d="M0 0L10 5L0 10z"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--muted);stroke-width:1.5;opacity:.6"/></pattern>
</defs><rect class="bg" x="0.5" y="0.5" width="639" height="359" rx="12"/><text x="24" y="34" class="h" text-anchor="start">pkg/dag</text><text x="24" y="54" class="s" text-anchor="start">Grouped nodes and edges; IsAcyclic() runs Kahn's algorithm</text><rect x="40" y="92" width="140" height="200" rx="10" class="grp"/><text x="50" y="110" class="m" text-anchor="start">group: ingest</text><rect x="250" y="92" width="140" height="200" rx="10" class="grp"/><text x="260" y="110" class="m" text-anchor="start">group: transform</text><rect x="460" y="92" width="140" height="200" rx="10" class="grp"/><text x="470" y="110" class="m" text-anchor="start">group: publish</text><g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.1;0.14;0.95;0.98;1" values="1;1;0.12;0.12;1;1"/><line x1="131.2822" y1="145.5739" x2="296.7831" y2="188.9194" class="e" marker-end="url(#am)"/></g><g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.23;0.27;0.95;0.98;1" values="1;1;0.12;0.12;1;1"/><line x1="131.2822" y1="244.4261" x2="296.7831" y2="201.0806" class="e" marker-end="url(#am)"/></g><g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.36;0.4;0.95;0.98;1" values="1;1;0.12;0.12;1;1"/><line x1="341.2822" y1="189.4261" x2="506.7831" y2="146.0806" class="e" marker-end="url(#am)"/></g><g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.36;0.4;0.95;0.98;1" values="1;1;0.12;0.12;1;1"/><line x1="341.2822" y1="200.5739" x2="506.7831" y2="243.9194" class="e" marker-end="url(#am)"/></g><g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.49;0.53;0.95;0.98;1" values="1;1;0.12;0.12;1;1"/><line x1="530" y1="162" x2="530" y2="226" class="e" marker-end="url(#am)"/></g><circle cx="110" cy="140" r="22" class="box"/><text x="110" y="145" class="t" text-anchor="middle">A</text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.108;0.12;0.95;0.962;1" values="0;0;1;1;0;0"/><circle cx="110" cy="140" r="22" class="ring-g"/></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.068;0.08;0.18;0.192;1" values="0;0;1;1;0;0"/><circle cx="110" cy="140" r="27" class="ring-o"/></g><circle cx="130" cy="120" r="10" class="box"/><g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;1" values="1;1"/><text x="130" y="124" class="m" text-anchor="middle">0</text></g><circle cx="110" cy="250" r="22" class="box"/><text x="110" y="255" class="t" text-anchor="middle">B</text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.238;0.25;0.95;0.962;1" values="0;0;1;1;0;0"/><circle cx="110" cy="250" r="22" class="ring-g"/></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.198;0.21;0.31;0.322;1" values="0;0;1;1;0;0"/><circle cx="110" cy="250" r="27" class="ring-o"/></g><circle cx="130" cy="230" r="10" class="box"/><g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;1" values="1;1"/><text x="130" y="234" class="m" text-anchor="middle">0</text></g><circle cx="320" cy="195" r="22" class="box"/><text x="320" y="200" class="t" text-anchor="middle">C</text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.368;0.38;0.95;0.962;1" values="0;0;1;1;0;0"/><circle cx="320" cy="195" r="22" class="ring-g"/></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.328;0.34;0.44;0.452;1" values="0;0;1;1;0;0"/><circle cx="320" cy="195" r="27" class="ring-o"/></g><circle cx="340" cy="175" r="10" class="box"/><g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.13;0.142;0.948;0.96;1" values="1;1;0;0;1;1"/><text x="340" y="179" class="m" text-anchor="middle">2</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.118;0.13;0.26;0.272;1" values="0;0;1;1;0;0"/><text x="340" y="179" class="m" text-anchor="middle">1</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.248;0.26;0.95;0.962;1" values="0;0;1;1;0;0"/><text x="340" y="179" class="m" text-anchor="middle">0</text></g><circle cx="530" cy="140" r="22" class="box"/><text x="530" y="145" class="t" text-anchor="middle">D</text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.498;0.51;0.95;0.962;1" values="0;0;1;1;0;0"/><circle cx="530" cy="140" r="22" class="ring-g"/></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.458;0.47;0.57;0.582;1" values="0;0;1;1;0;0"/><circle cx="530" cy="140" r="27" class="ring-o"/></g><circle cx="550" cy="120" r="10" class="box"/><g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.39;0.402;0.948;0.96;1" values="1;1;0;0;1;1"/><text x="550" y="124" class="m" text-anchor="middle">1</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.378;0.39;0.95;0.962;1" values="0;0;1;1;0;0"/><text x="550" y="124" class="m" text-anchor="middle">0</text></g><circle cx="530" cy="250" r="22" class="box"/><text x="530" y="255" class="t" text-anchor="middle">E</text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.628;0.64;0.95;0.962;1" values="0;0;1;1;0;0"/><circle cx="530" cy="250" r="22" class="ring-g"/></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.588;0.6;0.7;0.712;1" values="0;0;1;1;0;0"/><circle cx="530" cy="250" r="27" class="ring-o"/></g><circle cx="550" cy="230" r="10" class="box"/><g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.39;0.402;0.948;0.96;1" values="1;1;0;0;1;1"/><text x="550" y="234" class="m" text-anchor="middle">2</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.378;0.39;0.52;0.532;1" values="0;0;1;1;0;0"/><text x="550" y="234" class="m" text-anchor="middle">1</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.508;0.52;0.95;0.962;1" values="0;0;1;1;0;0"/><text x="550" y="234" class="m" text-anchor="middle">0</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.068;0.08;0.2;0.212;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">in-degree 0 → dequeue A, drop A→C (C: 2→1)</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.198;0.21;0.33;0.342;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">in-degree 0 → dequeue B, drop B→C (C: 1→0, enqueue C)</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.328;0.34;0.46;0.472;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">dequeue C, drop C→D, C→E (D: 1→0, E: 2→1)</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.458;0.47;0.59;0.602;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">dequeue D, drop D→E (E: 1→0, enqueue E)</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.588;0.6;0.72;0.732;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">dequeue E — no outgoing edges</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.718;0.73;0.95;0.962;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c green" text-anchor="start">&lt;-g.IsAcyclic() == true: every node was drained</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.068;0.08;0.95;0.962;1" values="0;0;1;1;0;0"/><text x="24" y="330" class="m" text-anchor="start">Kahn order:</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.108;0.12;0.95;0.962;1" values="0;0;1;1;0;0"/><text x="120" y="330" class="t green" text-anchor="start">A</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.238;0.25;0.95;0.962;1" values="0;0;1;1;0;0"/><text x="148" y="330" class="t green" text-anchor="start">B</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.368;0.38;0.95;0.962;1" values="0;0;1;1;0;0"/><text x="176" y="330" class="t green" text-anchor="start">C</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.498;0.51;0.95;0.962;1" values="0;0;1;1;0;0"/><text x="204" y="330" class="t green" text-anchor="start">D</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.628;0.64;0.95;0.962;1" values="0;0;1;1;0;0"/><text x="232" y="330" class="t green" text-anchor="start">E</text></g><text x="616" y="330" class="m" text-anchor="end">badge = in-degree</text></svg>
