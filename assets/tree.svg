<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">pkg/tree</title><desc id="desc">Key 7 descends a binary search tree comparing against 8, 3 and 6, is attached, then in-order traversal emits sorted keys.</desc><style>
svg{--bg:#ffffff;--card:#f6f8fa;--stroke:#d0d7de;--fg:#1f2328;--muted:#59636e;--blue:#0969da;--green:#1a7f37;--orange:#bc4c00;--red:#cf222e;--purple:#8250df}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--card:#161b22;--stroke:#3d444d;--fg:#e6edf3;--muted:#9198a1;--blue:#4493f8;--green:#3fb950;--orange:#f0883e;--red:#f85149;--purple:#ab7df8}}
.bg{fill:var(--bg);stroke:var(--stroke)}
.box{fill:var(--card);stroke:var(--stroke);stroke-width:1.5}
.slot{fill:none;stroke:var(--stroke);stroke-width:1.5;stroke-dasharray:5 4}
.grp{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:6 4}
.div{stroke:var(--stroke);stroke-width:1.5}
.h{fill:var(--fg);font:600 16px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.s{fill:var(--muted);font:13px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.t{fill:var(--fg);font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.c{fill:var(--fg);font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.m{fill:var(--muted);font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.blue{fill:var(--blue)}.green{fill:var(--green)}.orange{fill:var(--orange)}.red{fill:var(--red)}.purple{fill:var(--purple)}
.e{stroke:var(--muted);stroke-width:1.6;fill:none}
.eb{stroke:var(--blue);stroke-width:1.6;fill:none}
.ep{stroke:var(--purple);stroke-width:1.6;fill:none}
.ring-o{fill:none;stroke:var(--orange);stroke-width:3}
.ring-g{fill:var(--green);fill-opacity:.18;stroke:var(--green);stroke-width:2.5}
.ring-r{fill:none;stroke:var(--red);stroke-width:3}
.hatch{fill:url(#hatch);stroke:var(--stroke)}
.hl{fill:var(--orange);fill-opacity:.15;stroke:var(--orange);stroke-width:2}
.mk-m{fill:var(--muted)}.mk-b{fill:var(--blue)}.mk-p{fill:var(--purple)}
</style><defs>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-m" d="M0 0L10 5L0 10z"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-b" d="M0 0L10 5L0 10z"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-p" d="M0 0L10 5L0 10z"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="none"/><line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--muted);stroke-width:1.5;opacity:.6"/></pattern>
</defs><rect class="bg" x="0.5" y="0.5" width="639" height="359" rx="12"/><text x="24" y="34" class="h" text-anchor="start">pkg/tree</text><text x="24" y="54" class="s" text-anchor="start">BST walk: compare, descend, attach — then an in-order traversal</text><line x1="303.7" y1="117.6" x2="196.3" y2="167.4" class="e"/><line x1="336.3" y1="117.6" x2="443.7" y2="167.4" class="e"/><line x1="166.8" y1="187.2" x2="123.2" y2="227.8" class="e"/><line x1="193.2" y1="187.2" x2="236.8" y2="227.8" class="e"/><line x1="473.2" y1="187.2" x2="516.8" y2="227.8" class="e"/><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.46;0.48;0.95;0.97;1" values="0;0;1;1;0;0"/><line x1="261.0" y1="254.3" x2="289.0" y2="290.7" class="e"/></g><circle cx="320" cy="110" r="18" class="box"/><text x="320" y="115" class="t" text-anchor="middle">8</text><circle cx="180" cy="175" r="18" class="box"/><text x="180" y="180" class="t" text-anchor="middle">3</text><circle cx="460" cy="175" r="18" class="box"/><text x="460" y="180" class="t" text-anchor="middle">10</text><circle cx="110" cy="240" r="18" class="box"/><text x="110" y="245" class="t" text-anchor="middle">1</text><circle cx="250" cy="240" r="18" class="box"/><text x="250" y="245" class="t" text-anchor="middle">6</text><circle cx="530" cy="240" r="18" class="box"/><text x="530" y="245" class="t" text-anchor="middle">14</text><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.03;0.95;0.97;1" values="0;1;1;0;0"/><g transform="translate(350 80)"><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" keyTimes="0;0.14;0.18;0.28;0.32;0.42;0.46;1" values="350 80;350 80;210 145;210 145;280 210;280 210;300 305;300 305"/><circle cx="0" cy="0" r="18" class="box"/><circle cx="0" cy="0" r="18" class="ring-o"/><text x="0" y="5" class="t orange" text-anchor="middle">7</text></g></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.018;0.03;0.16;0.172;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">Insert(7): 7 &lt; 8 → go left</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.168;0.18;0.3;0.312;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">Insert(7): 7 &gt; 3 → go right</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.308;0.32;0.44;0.452;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">Insert(7): 7 &gt; 6 → go right</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.448;0.46;0.56;0.572;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">Insert(7): empty slot → attach as right child of 6</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.568;0.58;0.95;0.962;1" values="0;0;1;1;0;0"/><text x="24" y="80" class="c" text-anchor="start">InOrder(): left → node → right yields sorted keys</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.568;0.58;0.95;0.962;1" values="0;0;1;1;0;0"/><text x="320" y="345" class="m" text-anchor="end">InOrder:</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.568;0.58;0.63;0.642;1" values="0;0;1;1;0;0"/><circle cx="110" cy="240" r="23" class="ring-g"/></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.568;0.58;0.95;0.962;1" values="0;0;1;1;0;0"/><text x="330" y="345" class="t green" text-anchor="start">1</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.618;0.63;0.68;0.692;1" values="0;0;1;1;0;0"/><circle cx="180" cy="175" r="23" class="ring-g"/></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.618;0.63;0.95;0.962;1" values="0;0;1;1;0;0"/><text x="364" y="345" class="t green" text-anchor="start">3</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.668;0.68;0.73;0.742;1" values="0;0;1;1;0;0"/><circle cx="250" cy="240" r="23" class="ring-g"/></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.668;0.68;0.95;0.962;1" values="0;0;1;1;0;0"/><text x="398" y="345" class="t green" text-anchor="start">6</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.718;0.73;0.78;0.792;1" values="0;0;1;1;0;0"/><circle cx="300" cy="305" r="23" class="ring-g"/></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.718;0.73;0.95;0.962;1" values="0;0;1;1;0;0"/><text x="432" y="345" class="t green" text-anchor="start">7</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.768;0.78;0.83;0.842;1" values="0;0;1;1;0;0"/><circle cx="320" cy="110" r="23" class="ring-g"/></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.768;0.78;0.95;0.962;1" values="0;0;1;1;0;0"/><text x="466" y="345" class="t green" text-anchor="start">8</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.818;0.83;0.88;0.892;1" values="0;0;1;1;0;0"/><circle cx="460" cy="175" r="23" class="ring-g"/></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.818;0.83;0.95;0.962;1" values="0;0;1;1;0;0"/><text x="500" y="345" class="t green" text-anchor="start">10</text></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.868;0.88;0.93;0.942;1" values="0;0;1;1;0;0"/><circle cx="530" cy="240" r="23" class="ring-g"/></g><g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.868;0.88;0.95;0.962;1" values="0;0;1;1;0;0"/><text x="534" y="345" class="t green" text-anchor="start">14</text></g></svg>
